<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky7 — البلاغات</title>
<link rel="icon" href="assets/sky7.png">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<nav class="nav">
  <div class="brand"><img src="assets/sky7.png" alt=""> Sky7 · الإدارة</div>
  <div class="nav-icons">
    <a href="/admin/users" class="nav-btn">👥</a>
    <a href="/admin/reports" class="nav-btn" style="background:var(--accent)">🚩</a>
    <a href="/admin/credentials" class="nav-btn">✅</a>
  </div>
</nav>

<div style="max-width:1100px;margin:22px auto;padding:0 20px">
  <h2 style="margin-bottom:16px">البلاغات</h2>
  <div class="card" style="padding:8px">
    <table class="tbl">
      <thead><tr>
        <th>المُبلِّغ</th><th>المُبلَّغ عنه</th><th>السبب</th>
        <th>التاريخ</th><th>الحالة</th><th>إجراءات</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="6">جاري التحميل...</td></tr></tbody>
    </table>
  </div>
</div>

<script type="module">
import { auth, db } from '/assets/firebase-config.js';
import { onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get, update, remove, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $ = i => document.getElementById(i);

onAuthStateChanged(auth, async u => {
  if (!u) { location.href = '/admin'; return; }
  const s = await get(ref(db, 'users/' + u.uid));
  if (!s.val()?.isAdmin) { location.href = '/admin'; return; }

  onValue(ref(db, 'reports'), snap => {
    const arr = Object.values(snap.val() || {})
      .sort((a, b) => b.createdAt - a.createdAt);

    $('rows').innerHTML = arr.map(r => `
      <tr>
        <td>${r.reporterName || '—'}</td>
        <td><b>${r.targetName || '—'}</b></td>
        <td style="max-width:260px;font-size:13px;color:var(--mut)">${r.reason}</td>
        <td style="font-size:12px;color:var(--mut)">
          ${new Date(r.createdAt).toLocaleDateString('ar-EG')}</td>
        <td>${r.status === 'pending'
          ? '<span style="color:#f0a500">قيد المراجعة</span>'
          : r.status === 'banned'
          ? '<span style="color:#ff6b6b">تم الحظر</span>'
          : '<span style="color:#25d366">تم التجاهل</span>'}</td>
        <td style="display:flex;gap:6px">
          <button class="btn sm ghost"
            onclick="window.__ignore('${r.id}')">تجاهل</button>
          <button class="btn sm"
            onclick="window.__ban('${r.id}','${r.targetUid}')">حظر</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="6">لا بلاغات</td></tr>';
  });
});

window.__ignore = async id => {
  await update(ref(db, 'reports/' + id), { status: 'ignored' });
};

window.__ban = async (id, uid) => {
  if (!confirm('تأكيد حظر هذا المستخدم؟')) return;
  await update(ref(db, 'users/' + uid), { banned: true });
  await update(ref(db, 'reports/' + id), { status: 'banned' });
};
</script>
</body>
</html>
